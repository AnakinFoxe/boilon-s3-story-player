<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" role="img">
<title>一份目录表在内存里的样子</title>
<desc>左边是记录连成的大数组：876 条记录，每条 56 字节（编号、大小、时间 32 字节，加 24 字节的名字外壳），一份约 49 KB，块大，放 PSRAM。名字超过 15 字节时，外壳里只存指针，名字本身另占一个小块：873 块，每块约 37 字节，一份约 32 KB，块小，P5-8 之前放在内部 SRAM。</desc>
<style>
.bg{fill:#ffffff}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif}
.th{font-size:14px;font-weight:600;fill:#1f2328}
.ts{font-size:12px;fill:#59636e}
.ln,.mk{fill:none;stroke:#59636e}
.frame{fill:none;stroke:#8c959f}
.purple>rect{fill:#EEEDFE;stroke:#534AB7}
.purple>.ts{fill:#3C3489}
.coral>rect{fill:#FAECE7;stroke:#993C1D}
.coral>.ts{fill:#712B13}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117}
.th{fill:#e6edf3}
.ts{fill:#9198a1}
.ln,.mk{stroke:#9198a1}
.frame{stroke:#6e7681}
.purple>rect{fill:#3C3489;stroke:#AFA9EC}
.purple>.ts{fill:#CECBF6}
.coral>rect{fill:#712B13;stroke:#F0997B}
.coral>.ts{fill:#F5C4B3}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="680" height="270" rx="12"/>
<rect class="frame" x="30" y="20" width="300" height="230" rx="16" stroke-width="1" stroke-dasharray="5 4"/>
<text class="th" x="48" y="44">PSRAM：记录连成大数组</text>
<rect class="frame" x="370" y="20" width="280" height="230" rx="16" stroke-width="1" stroke-dasharray="5 4"/>
<text class="th" x="388" y="44">内部 SRAM（P5-8 之前）</text>
<g class="purple"><rect x="48" y="62" width="186" height="36" rx="4" stroke-width="0.8"/><text class="ts" x="141" y="80" text-anchor="middle" dominant-baseline="central">记录 1：编号、大小、时间</text></g>
<g class="coral"><rect x="238" y="62" width="74" height="36" rx="4" stroke-width="0.8"/><text class="ts" x="275" y="80" text-anchor="middle" dominant-baseline="central">名字 24 B</text></g>
<g class="purple"><rect x="48" y="106" width="186" height="36" rx="4" stroke-width="0.8"/><text class="ts" x="141" y="124" text-anchor="middle" dominant-baseline="central">记录 2</text></g>
<g class="coral"><rect x="238" y="106" width="74" height="36" rx="4" stroke-width="0.8"/><text class="ts" x="275" y="124" text-anchor="middle" dominant-baseline="central">名字 24 B</text></g>
<g class="purple"><rect x="48" y="150" width="186" height="36" rx="4" stroke-width="0.8"/><text class="ts" x="141" y="168" text-anchor="middle" dominant-baseline="central">记录 3</text></g>
<g class="coral"><rect x="238" y="150" width="74" height="36" rx="4" stroke-width="0.8"/><text class="ts" x="275" y="168" text-anchor="middle" dominant-baseline="central">名字 24 B</text></g>
<line class="ln" x1="312" y1="80" x2="408" y2="80" stroke-width="1" marker-end="url(#arrow)"/>
<line class="ln" x1="312" y1="124" x2="408" y2="124" stroke-width="1" marker-end="url(#arrow)"/>
<line class="ln" x1="312" y1="168" x2="408" y2="168" stroke-width="1" marker-end="url(#arrow)"/>
<g class="coral"><rect x="410" y="62" width="222" height="36" rx="4" stroke-width="0.8"/><text class="ts" x="521" y="80" text-anchor="middle" dominant-baseline="central">第027集 三打白骨精.mp3</text></g>
<g class="coral"><rect x="410" y="106" width="222" height="36" rx="4" stroke-width="0.8"/><text class="ts" x="521" y="124" text-anchor="middle" dominant-baseline="central">第028集 ……</text></g>
<g class="coral"><rect x="410" y="150" width="222" height="36" rx="4" stroke-width="0.8"/><text class="ts" x="521" y="168" text-anchor="middle" dominant-baseline="central">第029集 ……</text></g>
<text class="ts" x="48" y="206" dominant-baseline="central">…… 共 876 条，每条 56 字节</text>
<text class="ts" x="48" y="228" dominant-baseline="central">一份约 49 KB；块大，放 PSRAM</text>
<text class="ts" x="388" y="206" dominant-baseline="central">…… 共 873 块，每块约 37 字节</text>
<text class="ts" x="388" y="228" dominant-baseline="central">一份约 32 KB；块小，先进内部 SRAM</text>
</svg>
