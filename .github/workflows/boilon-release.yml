name: Release BOILON firmware

# Pushing a tag boilon-ai-player-vX.Y.Z builds the firmware from that commit and
# drafts a GitHub Release with the files; check them, write the notes, publish.
# A suffixed tag (boilon-ai-player-vX.Y.Z-trial1) drafts a trial release the same way.
on:
  push:
    tags:
      - 'boilon-ai-player-v*'

permissions:
  contents: read

concurrency:
  group: boilon-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the tag against m6_release.h
        shell: bash
        run: |
          name=$(sed -n 's/^inline constexpr char kName\[\] = "\(boilon-ai-player v[0-9][0-9.]*\)";$/\1/p' \
            main/boards/boilon-s3-gen2/m6_release.h)
          version=${name#boilon-ai-player }
          case "$GITHUB_REF_NAME" in
            "boilon-ai-player-$version" | "boilon-ai-player-$version"-*) ;;
            *) echo "::error::tag $GITHUB_REF_NAME does not match '$name' in m6_release.h"; exit 1 ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the firmware and collect the release files
        # As in build.yml: build the checked-in lockfile.
        env:
          IDF_COMPONENT_CHECK_NEW_VERSION: "0"
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          mkdir -p dist
          python scripts/build.py boilon-s3-gen2 --name boilon-s3-gen2-ai
          cp build/xiaozhi.bin "dist/boilon-ai-player-$VERSION.bin"
          python scripts/boilon/collect_licenses.py build dist/THIRD_PARTY_LICENSES.txt
          python scripts/boilon/make_otadata.py dist/boilon-otadata-ota1.bin
          cp scripts/boilon/boilon_flash.py scripts/boilon/rom_latch_gpio15.py dist/
          cd dist
          sha256sum "boilon-ai-player-$VERSION.bin" boilon-otadata-ota1.bin boilon_flash.py \
            rom_latch_gpio15.py THIRD_PARTY_LICENSES.txt > SHA256SUMS
          cat SHA256SUMS

      - name: Upload the release files
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  draft:
    name: Draft the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "boilon-ai-player ${GITHUB_REF_NAME#boilon-ai-player-}" \
            --notes "Built by CI from $GITHUB_SHA. Check SHA256SUMS, write the notes, then publish." \
            dist/*
